name: Build and deploy
on:
  push:
    branches: [main]
  # Also started by blog-check.yml when the blog's articles in HeyCatch have changed (README: "Blog").
  workflow_dispatch:
  # The studio founding price ($19 / $190) shows until the start of 1 January
  # 2027, Eastern time, and the school founding price ($299) until the start of
  # 1 July 2027. These rebuilds at 05:05 UTC on 1 January and 04:05 UTC on
  # 1 July (00:05 Eastern both times) switch the pricing and subscribe pages to
  # $24 / $240 and to $349 (src/_data/pricing.js).
  schedule:
    - cron: "5 5 1 1 *"
    - cron: "5 4 1 7 *"
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # The pages that are new or changed since the live site, for IndexNow once the deploy is done.
    outputs:
      indexnow: ${{ steps.changed.outputs.urls }}
    steps:
      # The whole history: each page's sitemap lastmod is when its own files last changed on main (scripts/lastmod.mjs).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The last good copy of the blog's articles, used only if HeyCatch can't be read during this build.
      - uses: actions/cache@v4
        with:
          path: .cache/heycatch
          key: heycatch-blog-${{ github.run_id }}
          restore-keys: heycatch-blog-
      - run: npm run build
        env:
          HEYCATCH_API_KEY: ${{ secrets.HEYCATCH_API_KEY }}
      # Compared with the live sitemap before it is replaced. Never fails the build.
      - id: changed
        run: node scripts/indexnow.mjs changed _site/sitemap.xml >> "$GITHUB_OUTPUT"
        continue-on-error: true
      # The build, for the deploy job below.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1
  # The site's Worker serves myprogrampartner.com, and a second Worker sends www there (wrangler.jsonc,
  # www/wrangler.jsonc; README: "Hosting"). Both with the CLOUDFLARE_API_TOKEN repository secret.
  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      # The one-time move off GitHub Pages: frees the two names for the Workers' custom domains, and does nothing once
      # it has run (scripts/cloudflare-switch-over.mjs).
      - run: node scripts/cloudflare-switch-over.mjs before
      - run: npx --yes wrangler@4.168.0 deploy
      - run: npx --yes wrangler@4.168.0 deploy --config www/wrangler.jsonc
      # If either deploy failed, GitHub Pages gets its records back and serves the site again.
      - if: failure()
        run: node scripts/cloudflare-switch-over.mjs restore
  # Tells the search engines that take IndexNow which pages changed (src/_data/indexnow.js). Never fails the deploy.
  indexnow:
    timeout-minutes: 5
    needs: [build, deploy]
    if: needs.build.outputs.indexnow != '' && needs.build.outputs.indexnow != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs submit
        env:
          INDEXNOW_URLS: ${{ needs.build.outputs.indexnow }}
        continue-on-error: true
