name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # The founding price ($299) shows until the start of 1 July 2027, Eastern
  # time. This rebuild at 04:05 UTC on 1 July (00:05 Eastern) switches the
  # pricing and subscribe pages to $349 (src/_data/pricing.js).
  schedule:
    - cron: "5 4 1 7 *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
